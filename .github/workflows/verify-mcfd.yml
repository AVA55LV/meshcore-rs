name: Verify ota-app 1.2 release packages
on:
  push:
    branches: [qa/ota-app-1.2]
permissions:
  contents: read
env:
  GH_TOKEN: ${{ github.token }}
jobs:
  check:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Set-MpPreference -DisableRealtimeMonitoring $false
          $initial=Get-MpPreference
          foreach($kind in @("ExclusionPath","ExclusionExtension","ExclusionProcess")){
            $values=$initial.$kind
            if($values){$remove=@{};$remove[$kind]=$values;Remove-MpPreference @remove}
          }
          Update-MpSignature
          Start-Sleep 5
          Get-MpComputerStatus | Format-List AMServiceEnabled,AntivirusEnabled,RealTimeProtectionEnabled,AntivirusSignatureVersion,AntivirusSignatureLastUpdated
          $prefs=Get-MpPreference
          if ($prefs.ThreatIDDefaultAction_Ids -contains 2147731250) { throw 'Unexpected local rule' }
          $dir=New-Item -ItemType Directory C:/ota-release-audit
          $path=Join-Path $dir.FullName 'ota-app-1.2-Windows-x86-x64.exe'
          $scan=Join-Path $env:ProgramFiles 'Windows Defender/MpCmdRun.exe'
          $platform=Get-ChildItem 'C:/ProgramData/Microsoft/Windows Defender/Platform' -Directory | Where-Object Name -match '^[0-9]' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if($platform){$scan=Join-Path $platform.FullName 'MpCmdRun.exe'}
          $start=Get-Date
          try {
            Invoke-WebRequest -UseBasicParsing https://api.github.com/repos/AVA55LV/meshcore-rs/releases/assets/783565494 -Headers @{Authorization="Bearer $env:GH_TOKEN";Accept="application/octet-stream"} -OutFile $path
            & $scan -CheckExclusion -path $path
            if($LASTEXITCODE -ne 1){throw "Path exclusion check did not confirm a scannable file: $LASTEXITCODE"}
            $hash=(Get-FileHash $path).Hash
            if($hash -ne "9C11943D4E784315F78637CF85E3B2C4418478E51A89BB365AE6981AC21A52EB"){throw "Wrong package"}
            if(!(Get-MpComputerStatus).RealTimeProtectionEnabled){throw 'Realtime protection unavailable'}
            & $scan -Scan -ScanType 3 -File $path -DisableRemediation
            Write-Host "Scanner returned $LASTEXITCODE"
            if($LASTEXITCODE -ne 0){throw 'Inspect scan result'}
          } finally {
            Get-WinEvent -FilterHashtable @{LogName='Microsoft-Windows-Windows Defender/Operational';StartTime=$start;Id=1116,1117} -ErrorAction SilentlyContinue | ForEach-Object Message
          }

  android:
    runs-on: ubuntu-latest
    steps:
      - run: |
          gh api -H 'Accept: application/octet-stream' repos/AVA55LV/meshcore-rs/releases/assets/783564901 > app.apk
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          cat > ui.py <<'PY'
          import subprocess as sp, xml.etree.ElementTree as ET, re, time
          def run(*args): return sp.check_output(['adb',*args])
          def nodes():
              run('shell','uiautomator','dump','/data/local/tmp/window.xml')
              return list(ET.fromstring(run('exec-out','cat','/data/local/tmp/window.xml')).iter('node'))
          def box(n): return list(map(int,re.findall(r'\d+',n.get('bounds'))))
          def tap(n):
              x,y,r,b=box(n)
              run('shell','input','tap',str((x+r)//2),str((y+b)//2))
              time.sleep(.5)
          ns=nodes()
          buttons=[n.get('text') for n in ns if n.get('class')=='android.widget.Button']
          assert buttons.index('ИНСТРУКЦИЯ')==buttons.index('Найти USB-устройства')+1, buttons
          tap(next(n for n in ns if n.get('text')=='ИНСТРУКЦИЯ'))
          assert any('Для .mcfd' in n.get('text','') for n in nodes())
          run('shell','input','keyevent','4')
          tap(next(n for n in nodes() if n.get('class')=='android.widget.Spinner'))
          assert {'USB OTG','Wi-Fi / TCP','Bluetooth LE'}.issubset({n.get('text') for n in nodes()})
          open('Android-dropdown.png','wb').write(run('exec-out','screencap','-p'))
          PY
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          script: |
            adb install app.apk
            adb shell am start -W -n ru.ommesh.otg/.MainActivity
            python3 ui.py
      - uses: actions/upload-artifact@v4
        with:
          name: android-dropdown
          path: Android-dropdown.png