name: Build universal macOS package
on:
  push:
    branches: [qa/ota-app-1.2]
    paths: ['.github/workflows/macos-universal.yml']
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install universal Python and Tcl/Tk
        run: |
          curl -fsSL --retry 3 https://www.python.org/ftp/python/3.11.9/python-3.11.9-macos11.pkg -o "$RUNNER_TEMP/python.pkg"
          pkgutil --check-signature "$RUNNER_TEMP/python.pkg" | tee "$RUNNER_TEMP/signature.txt"
          grep -F "Python Software Foundation" "$RUNNER_TEMP/signature.txt"
          sudo installer -pkg "$RUNNER_TEMP/python.pkg" -target /
          /Library/Frameworks/Python.framework/Versions/3.11/bin/python3.11 -m venv "$RUNNER_TEMP/universal"
          echo "$RUNNER_TEMP/universal/bin" >> "$GITHUB_PATH"
      - name: Build and verify both architectures
        working-directory: tools/desktop-flasher
        env:
          ARCHFLAGS: '-arch x86_64 -arch arm64'
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: |
          python -m pip install -q -r requirements.txt 'pyinstaller>=6.12,<7' pillow
          python - <<'PY'
          import importlib.metadata as md, pathlib, subprocess as sp, tempfile, zipfile
          kinds = {bytes.fromhex(h) for h in ['cafebabe','cafebabf','feedface','feedfacf','cefaedfe','cffaedfe']}
          for dist in md.distributions():
              missing = []
              for f in dist.files or ():
                  p=pathlib.Path(dist.locate_file(f))
                  if not p.is_file(): continue
                  with p.open('rb') as data: magic=data.read(4)
                  if magic not in kinds: continue
                  if 'arm64' not in sp.check_output(['lipo','-archs',p],text=True).split():
                      missing.append((p,str(f)))
              if not missing: continue
              with tempfile.TemporaryDirectory() as tmp:
                  sp.run(['python','-m','pip','download','--platform','macosx_11_0_arm64','--only-binary=:all:','--no-deps','-d',tmp,dist.metadata['Name']+'=='+dist.version],check=True)
                  with zipfile.ZipFile(next(pathlib.Path(tmp).glob('*.whl'))) as z:
                      for p,rel in missing:
                          arm=pathlib.Path(tmp)/'arm'
                          arm.write_bytes(z.read(rel))
                          out=pathlib.Path(tmp)/'fat'
                          sp.run(['lipo','-create',p,arm,'-output',out],check=True)
                          p.write_bytes(out.read_bytes())
          PY
          sed 's/name="MeshCore",console/target_arch="universal2",name="MeshCore",console/' MeshCore.spec > Universal.spec
          python -m PyInstaller --clean --noconfirm Universal.spec
          lipo -verify_arch arm64 x86_64 dist/MeshCore.app/Contents/MacOS/MeshCore
          dist/MeshCore.app/Contents/MacOS/MeshCore --smoke-test
          mkdir -p out
          ditto -c -k --sequesterRsrc --keepParent dist/MeshCore.app out/MeshCore-macOS-Apple-Silicon.zip
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-arm64
          path: tools/desktop-flasher/out/MeshCore-macOS-Apple-Silicon.zip
